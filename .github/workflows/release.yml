name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # pubspec.yaml is the single source of truth for the version. Catching a
      # mismatch here beats shipping a DMG whose name disagrees with the app.
      - name: Check the tag matches pubspec
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter test

      - run: flutter build macos --release

      - name: Package as a DMG
        run: |
          # The DMG carries an /Applications symlink next to the app — the
          # classic "drag here" layout. Without it people double-click the app
          # inside the DMG, where Gatekeeper blocks it AND the quarantine fix
          # cannot be applied (a mounted DMG is read-only).
          mkdir dmg-staging
          ditto "build/macos/Build/Products/Release/2as w Laze2.app" "dmg-staging/2as w Laze2.app"
          ln -s /Applications "dmg-staging/Applications"
          hdiutil create \
            -volname "2as w Laze2" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "2as-w-Laze2-${GITHUB_REF_NAME}.dmg"

          # A second copy under a fixed name. GitHub's permanent
          # /releases/latest/download/<file> URL matches on the exact filename,
          # so the versioned one alone would break the README link on every
          # release. Versioned copy stays for anyone archiving a specific build.
          cp "2as-w-Laze2-${GITHUB_REF_NAME}.dmg" "2as-w-Laze2.dmg"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            2as-w-Laze2-*.dmg
            2as-w-Laze2.dmg
          body: |
            ## Install

            1. Open the DMG and drag **2as w Laze2** onto the **Applications**
               shortcut next to it. **Don't open it inside the DMG** — macOS
               will block it there and the fix can't be applied.
            2. macOS will say it *"could not verify the app is free of
               malware"* — expected for an app that isn't notarized by Apple.
               Unblock it either way:
               - **Terminal:** `xattr -dr com.apple.quarantine "/Applications/2as w Laze2.app"`
               - **No Terminal:** open the app once (it gets blocked, click
                 Done), then System Settings → **Privacy & Security** → scroll
                 down → **Open Anyway**.
            3. On first launch, grant **Accessibility** (System Settings →
               Privacy & Security → Accessibility) — without it the app can
               read your clipboard but cannot paste for you.

            Press **⌘⇧V** to open the panel.
