name: copy_paste
description: "2as w Laze2 — minimal macOS clipboard history utility."
publish_to: 'none'

# Single source of truth for the version. Tag releases as v<version> (e.g. v1.0.0).
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # No Material icons are used, so the ~1.6 MB icon font is not bundled.
  uses-material-design: false
